name: PR Security Comment Handler

on:
  issue_comment:
    types: [created]

jobs:
  handle-security-comment:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '.terraform.security')
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
      
      - name: Execute security processing
        run: |
          echo "Starting Terraform security processing..."
          sleep 2
          echo "Security processing completed successfully"
      
      - name: Post success comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Terraform security processing completed successfully!'
            });